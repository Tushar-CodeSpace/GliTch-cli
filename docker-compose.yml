services:
  postgres:
    image: postgres:16-alpine
    container_name: glitch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: glitch_user
      POSTGRES_PASSWORD: glitch_pass
      POSTGRES_DB: glitch_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glitch_user -d glitch_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - glitch-net

  redis:
    image: redis:7-alpine
    container_name: glitch-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - glitch-net

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: glitch-auth-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=glitch_user
      - DB_PASSWORD=glitch_pass
      - DB_NAME=glitch_db
      - DB_SSLMODE=disable
      - JWT_SECRET=glitch-ultra-secure-monorepo-secret-key-32b
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - glitch-net

  telemetry-service:
    build:
      context: ./telemetry-service
      dockerfile: Dockerfile
    container_name: glitch-telemetry-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
      - HOST_PROC=/host/proc
      - HOST_SYS=/host/sys
      - HOST_ETC=/host/etc
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc:/host/etc:ro
    networks:
      - glitch-net

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: glitch-api-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - AUTH_SERVICE_URL=http://auth-service:8081
      - TELEMETRY_SERVICE_URL=http://telemetry-service:8082
      - REDIS_HOST=redis:6379
      - JWT_SECRET=glitch-ultra-secure-monorepo-secret-key-32b
      - RATE_LIMIT_RPS=30
      - RATE_LIMIT_BURST=60
    depends_on:
      - auth-service
      - telemetry-service
      - redis
    networks:
      - glitch-net

  tui-client:
    build:
      context: ./tui-client
      dockerfile: Dockerfile
    container_name: glitch-tui-client
    stdin_open: true
    tty: true
    environment:
      - GATEWAY_URL=http://api-gateway:8000
      - AUTH_URL=http://api-gateway:8000/api/v1/auth/login
    depends_on:
      - api-gateway
    networks:
      - glitch-net

volumes:
  postgres_data:
  redis_data:

networks:
  glitch-net:
    driver: bridge
